services:
  - type: web
    name: agent
    runtime: docker
    plan: free
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: DAILY_BUDGET_USD
        value: "5.0"
      - key: REDIS_URL
        fromService:
          type: redis
          name: agent-redis
          property: connectionString
  - type: redis
    name: agent-redis
    ipAllowList: []
    plan: free
